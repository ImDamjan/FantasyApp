<div class="form-field" [class.form-field--invalid]="errorMessage">
  <label class="form-field__label">{{ label }}</label>
  <input
    class="form-field__input"
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
  />
  @if (errorMessage) {
    <span class="form-field__error">{{ errorMessage }}</span>
  }
</div>
